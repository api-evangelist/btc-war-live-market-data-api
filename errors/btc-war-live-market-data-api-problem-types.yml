fail_closed:
  behaviour: >-
    The API fails closed. A single-symbol observation is served only when the complete validated nine-market snapshot is
    available and fresh; otherwise the request 502s rather than returning a stale or partial value.
  agent_rule: Abstain rather than estimate, reuse an earlier value, or substitute another venue.
