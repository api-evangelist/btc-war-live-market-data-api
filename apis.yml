name: BTC War Live Market Data API
description: >-
  Public, keyless, read-only real-time crypto market-data API from btcwar.net, exposing live Binance Spot snapshots and
  single-market observations for nine USDT pairs as JSON and Schema.org JSON-LD. Every response carries provenance, a
  source timestamp, a rolling 24-hour window definition and an explicit limitations statement, and the service fails
  closed rather than serving a stale or partial value. It ships one of the most complete agent-native discovery stacks in
  the catalog: OpenAPI 3.1 (canonical and self-contained bundle), an Arazzo 1.1 workflow, JSON Schema 2020-12 validation
  contracts, a hosted Streamable HTTP MCP server, a published Agent Skill, an agentic-access execution contract, an error
  catalog, an interpretation vocabulary, an RFC 9727 API catalog, a W3C DCAT 3 catalog, llms.txt and RFC 9116
  security.txt.
